spring.application.name=reservation2026
spring.application.frontend-url=http://localhost:8080

# Lecture du fichier .env (absent du Word, nécessaire pour que les ${...} ci-dessous soient résolus)
spring.config.import=optional:file:.env[.properties]

# URL de connexion à la base de données
spring.datasource.url=jdbc:mysql://localhost:3306/reservations?autoreconnect=true&useSSL=false&serverTimezone=Europe/Brussels&useLegacyDatetimeCode=false

# Identifiants de connexion
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.tomcat.testOnBorrow=true

# Driver MySQL (optionnel, géré automatiquement par Spring Boot)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Affiche les requêtes SQL dans la console (pratique pour le débogage)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 1. Désactiver la création automatique de Hibernate pour laisser la main à Flyway
spring.jpa.hibernate.ddl-auto=none

# 2. Activer explicitement Flyway (activé par défaut si le starter est présent)
spring.flyway.enabled=true

# 3. Permettre l'initialisation si votre base de données contient déjà des tables
spring.flyway.baseline-on-migrate=true

# Enable use of hidden input to override HTML method in form (put & delete)
spring.mvc.hiddenmethod.filter.enabled=true

# Email configuration
spring.mail.host=smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true